name: TypeFacilitator

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (typing engine)
        run: ./gradlew :core:test --console=plain
      - name: Assemble APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
      - name: APK size and permissions
        run: |
          ls -la app/build/outputs/apk/*/*.apk
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump permissions app/build/outputs/apk/release/app-release.apk | tee perms.txt
          if grep -q INTERNET perms.txt; then echo "APK must not request internet access"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: TypeFacilitator-apk
          path: app/build/outputs/apk/**/*.apk

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34
            target: google_apis
            profile: pixel_6
          - api: 23
            target: default
            profile: Nexus 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
      - name: Run on emulator (Android API ${{ matrix.api }}, ${{ matrix.profile }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/emulator_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots-api${{ matrix.api }}
          path: emulator-out/
      - name: Publish report, screenshots and APK to the branch
        if: always()
        run: |
          pip install --quiet pillow
          D=ci-out/api-${{ matrix.api }}
          rm -rf $D && mkdir -p $D
          python3 - "$D" <<'PY'
          import glob, os, sys
          from PIL import Image
          for f in sorted(glob.glob("emulator-out/*.png")):
              try:
                  im = Image.open(f).convert("RGB")
                  im.thumbnail((480, 1100))
                  im.save(os.path.join(sys.argv[1], os.path.basename(f)[:-4] + ".jpg"), quality=70)
              except Exception as e:
                  print("skip", f, e)
          PY
          cp emulator-out/report.txt $D/ 2>/dev/null || echo "no report (test did not finish)" > $D/report.txt
          tail -c 200000 emulator-out/logcat.txt > $D/logcat-tail.txt 2>/dev/null || true
          if [ "${{ matrix.api }}" = "34" ]; then
            mkdir -p ci-out/apk && cp app/build/outputs/apk/release/app-release.apk ci-out/apk/TypeFacilitator.apk
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-out
          git commit -q -m "TypeFacilitator: emulator results for API ${{ matrix.api }} [skip ci]" || exit 0
          for i in 1 2 3 4; do
            git pull -q --rebase origin "${{ github.ref_name }}" && git push -q origin "HEAD:${{ github.ref_name }}" && break
            sleep $((i * 5))
          done
